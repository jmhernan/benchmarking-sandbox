[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "bench-stats"
version = "0.0.1"
description = "Statistical layer on top of bench_press: process-level intervals, threshold gate, variance diagnostics and validation."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.0",
    "pyyaml>=6.0",
    "scipy>=1.13",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
bench-stats = "bench_stats.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# The end-to-end runner test builds Dart AOT binaries (about a minute); run it with `python -m pytest -m dart`.
addopts = "-m 'not dart'"
markers = ["dart: needs the Dart SDK and a bench_press clone next to this repository; slow"]
